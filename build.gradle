plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation platform('org.lwjgl:lwjgl-bom:3.3.6')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.joml:joml:1.10.8'

    def architecture = System.getProperty('os.arch')
    def natives = architecture == 'aarch64' ? 'natives-windows-arm64' : 'natives-windows'
    runtimeOnly "org.lwjgl:lwjgl::$natives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$natives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$natives"
}

application {
    mainClass = 'javaengine.AxeDemo'
}
